<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Course Registration</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main class="card">
    <p class="eyebrow">Flask + MongoDB Atlas</p>
    <h1>Course registration</h1>
    <p class="intro">Enter your details to create a submission.</p>

    {% if error %}
      <div class="alert" role="alert"><strong>Submission error:</strong> {{ error }}</div>
    {% endif %}

    <form action="{{ url_for('submit') }}" method="post">
      <label for="name">Full name</label>
      <input id="name" name="name" value="{{ form.get('name', '') }}" required>

      <label for="email">Email address</label>
      <input id="email" name="email" type="email" value="{{ form.get('email', '') }}" required>

      <label for="course">Course</label>
      <input id="course" name="course" value="{{ form.get('course', '') }}" required>

      <button type="submit">Submit data</button>
    </form>
  </main>
</body>
</html>
